<!-- src/app/components/toggle/toggle.component.html -->

<span class="relative inline-flex items-center mt-1"
    [class.cursor-pointer]="!disabled()" [class.opacity-50]="disabled()" [class.cursor-not-allowed]="disabled()">
    <input type="checkbox" role="switch" [checked]="checked()" [disabled]="disabled()"
        [attr.aria-checked]="checked()" (change)="onToggle($event)" class="sr-only peer">
    <div class="switch-track"></div>
</span>
