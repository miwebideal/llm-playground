<!-- src/app/shared/components/error-banner/error-banner.component.html -->

<!-- ERROR -->
<div class="rounded-lg border border-error/30 bg-error-bg/60 p-3 text-sm">
    <div class="flex items-start gap-2">
        <svg lucideCircleAlert class="w-4 h-4 shrink-0 mt-0.5 text-error"></svg>
        <div class="flex-1 min-w-0">
            <p class="font-semibold text-error">{{ meta().title }}</p>
            <p class="text-text-main wrap-break-word whitespace-pre-wrap">{{ error().message }}</p>

            @if (error().hint) {
            <p class="mt-1 flex items-start gap-1 text-xs text-text-muted">
                <svg lucideLightbulb class="w-3.5 h-3.5 shrink-0 mt-0.5"></svg>
                <span>{{ error().hint }}</span>
            </p>
            }

            @if (error().providerMessage && error().providerMessage !== error().message) {
            <details class="mt-1">
                <summary class="text-xs text-text-muted cursor-pointer select-none hover:text-text-main">Ver detalle del proveedor</summary>
                <pre class="mt-1 whitespace-pre-wrap wrap-break-word text-[11px] text-text-muted">{{ error().providerMessage }}</pre>
            </details>
            }
        </div>
    </div>

    <!-- ACTIONS -->
    <div class="flex items-center justify-end gap-2 mt-2">
        <button type="button" class="chip" (click)="copyDetails()">
            <svg lucideCopy class="w-3 h-3"></svg> Copiar detalle
        </button>
        @if (error().retryable) {
        <button type="button" class="chip border-primary/40 text-primary" (click)="retry.emit()">
            <svg lucideRefreshCw class="w-3 h-3"></svg> Reintentar
        </button>
        }
    </div>
</div>
