<!-- src/app/features/sidebar/sidebar-parameters/sidebar-parameters.component.html -->

@if (session(); as current) {
<div class="flex flex-col gap-2">

    <!-- HEADER -->
    <div class="flex items-center justify-between">
        <label class="row-toggle">
            <span class="label-base group-hover:text-primary transition-colors">Parámetros</span>
            <app-toggle [checked]="current.useParams" (checkedChange)="update('useParams', $event)"></app-toggle>
        </label>
        <button type="button" (click)="resetSettings()" class="chip">
            <svg lucideRotateCcw class="w-3 h-3"></svg> Reset
        </button>
    </div>

    @if (current.useParams) {
    <div class="flex flex-col gap-2.5 animate-fade-in">

        <div class="grid grid-cols-2 gap-2">
            <div class="field">
                <label class="label-base">Temp</label>
                <input type="number" step="0.1" min="0" max="2" [value]="current.temperature"
                    (input)="onNumber('temperature', $event)" class="input-base text-center text-xs"
                    [disabled]="!capabilities()?.temperature">
            </div>

            <div class="field">
                <label class="label-base">Top-P</label>
                <input type="number" step="0.1" min="0" max="1" [value]="current.topP"
                    (input)="onNumber('topP', $event)" class="input-base text-center text-xs"
                    [disabled]="!capabilities()?.topP">
            </div>

            <div class="field">
                <label class="label-base">{{ tokenLabel() }}</label>
                <input type="number" [value]="current.maxTokens"
                    (input)="onNumber('maxTokens', $event)" class="input-base text-center text-xs"
                    [disabled]="capabilities()?.tokenLimit === 'none'">
            </div>

            <div class="field flex flex-col justify-end">
                <label class="row-toggle">
                    <span class="label-base group-hover:text-primary">JSON</span>
                    <app-toggle [checked]="current.jsonMode" [disabled]="!capabilities()?.jsonMode"
                        (checkedChange)="update('jsonMode', $event)"></app-toggle>
                </label>
            </div>
        </div>

        <!-- SYSTEM -->
        <div class="field">
            <label class="label-base">System prompt</label>
            <textarea [value]="current.systemPrompt" (input)="onSystemPrompt($event)"
                class="input-base resize-y min-h-16 max-h-[40vh]" [disabled]="!capabilities()?.systemPrompt"></textarea>
        </div>

        @if (restrictedLabels().length) {
        <p class="flex items-start gap-1.5 text-[11px] text-warning">
            <svg lucideTriangleAlert class="w-3.5 h-3.5 shrink-0 mt-0.5"></svg>
            <span>No soportado por este modelo: {{ restrictedLabels().join(', ') }}.</span>
        </p>
        }
    </div>
    }
</div>
}
