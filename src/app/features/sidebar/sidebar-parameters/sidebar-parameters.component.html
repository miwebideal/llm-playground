<!-- src/app/features/sidebar/sidebar-parameters/sidebar-parameters.component.html -->

<div class="flex flex-col gap-2">

    <!-- HEADER -->
    <div class="flex items-center justify-between">
        <label class="row-toggle">
            <span class="label-base group-hover:text-primary transition-colors">Parámetros</span>
            <app-toggle [checked]="session().useParams" (checkedChange)="update('useParams', $event)"></app-toggle>
        </label>
        <button type="button" (click)="resetSettings()" class="chip-btn">
            <svg lucideRotateCcw class="w-3 h-3"></svg> Reset
        </button>
    </div>

    @if (session().useParams) {
    <div class="flex flex-col gap-2.5 animate-fade-in">

        <div class="grid grid-cols-2 gap-2">

            <div class="field">
                <label class="label-base">Temp</label>
                <input type="number" step="0.1" min="0" max="2" [value]="session().temperature"
                    (input)="update('temperature', +$any($event).target.value)" class="input-base text-center text-xs">
            </div>

            <div class="field">
                <label class="label-base">Top-P</label>
                <input type="number" step="0.1" min="0" max="1" [value]="session().topP"
                    (input)="update('topP', +$any($event).target.value)" class="input-base text-center text-xs">
            </div>

            <div class="field">
                <label class="label-base">Max tokens</label>
                <input type="number" [value]="session().maxTokens"
                    (input)="update('maxTokens', +$any($event).target.value)" class="input-base text-center text-xs">
            </div>

            <div class="field flex flex-col justify-end">
                <label class="row-toggle">
                    <span class="label-base group-hover:text-primary">JSON</span>
                    <app-toggle [checked]="session().jsonMode"
                        (checkedChange)="update('jsonMode', $event)"></app-toggle>
                </label>
            </div>
        </div>

        <!-- SYSTEM -->
        <div class="field">
            <label class="label-base">System prompt</label>
            <textarea [value]="session().systemPrompt" (input)="update('systemPrompt', $any($event).target.value)"
                class="input-base resize-y min-h-16 max-h-[40vh]"></textarea>
        </div>
    </div>
    }
</div>
