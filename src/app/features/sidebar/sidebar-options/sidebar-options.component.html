<!-- src/app/features/sidebar/sidebar-options/sidebar-options.component.html -->

<div class="flex flex-col gap-2">
    <span class="label-base">Chat</span>
    <label class="row-toggle">
        <span class="text-sm text-text-main">Incluir historial</span>
        <app-toggle [checked]="config().includeHistory" (checkedChange)="update('includeHistory', $event)"></app-toggle>
    </label>
    <label class="row-toggle">
        <span class="text-sm text-text-main">Modo stream</span>
        <app-toggle [checked]="config().streamMode" (checkedChange)="update('streamMode', $event)"></app-toggle>
    </label>
</div>
