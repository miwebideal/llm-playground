<!-- src/app/features/sidebar/sidebar.component.html -->

<aside
    class="h-full bg-surface border-r border-border-base flex flex-col transition-all duration-300 ease-in-out shadow-2xl lg:shadow-none fixed lg:relative pb-16 md:pb-0"
    [class.w-72]="!isCollapsedDesktop()" [class.lg:w-14]="isCollapsedDesktop()"
    [class.-translate-x-full]="!isOpenMobile()" [class.translate-x-0]="isOpenMobile()" [class.lg:translate-x-0]="true">

    <!-- COLLAPSED -->
    @if (isCollapsedDesktop()) {
    <div class="hidden lg:flex flex-col items-center py-3 h-full">
        <button (click)="toggleDesktop()" class="btn-icon" title="Expandir configuración">
            <svg lucideSettings class="w-5 h-5"></svg>
        </button>
        <div class="mt-auto">
            <button (click)="toggleDesktop()" class="btn-icon">
                <svg lucideChevronRight class="w-4 h-4"></svg>
            </button>
        </div>
    </div>
    }

    <!-- EXPANDED -->
    @if (!isCollapsedDesktop()) {
    <div class="flex flex-col h-full w-72 animate-fade-in">

        <!-- HEADER MOBILE -->
        <div class="flex items-center justify-between px-3 py-2.5 lg:hidden border-b border-border-base shrink-0">
            <span class="font-semibold text-sm text-text-main">Configuración</span>
            <button (click)="closeMobile.emit()" class="btn-icon">
                <svg lucideX class="w-4 h-4"></svg>
            </button>
        </div>

        <!-- HEADER DESKTOP -->
        <div class="hidden lg:flex items-center justify-between px-3 py-2 border-b border-border-base shrink-0">
            <span class="font-semibold text-sm text-text-main flex items-center gap-2">
                <svg lucideSettings class="w-4 h-4 text-primary"></svg> Configuración
            </span>
            <button (click)="toggleDesktop()" class="btn-icon" title="Colapsar panel">
                <svg lucideChevronLeft class="w-4 h-4"></svg>
            </button>
        </div>

        <!-- COMPARE -->
        <div class="px-3 py-2.5 border-b border-border-base shrink-0 flex flex-col gap-2">
            <label class="row-toggle">
                <span class="text-sm font-semibold text-primary">Modo Comparación</span>
                <app-toggle [checked]="globalConfig().isCompareMode"
                    (checkedChange)="updateGlobal('isCompareMode', $event)"></app-toggle>
            </label>

            <div class="grid transition-all duration-300 ease-in-out"
                [class]="globalConfig().isCompareMode ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'">
                <div class="overflow-hidden min-h-0">
                    <div class="flex p-0.5 bg-black/5 dark:bg-white/5 rounded-lg border border-border-base">
                        @for (session of sessions(); track session.id) {
                        <button type="button" (click)="activeSessionId.set(session.id)"
                            class="flex-1 py-1 text-xs rounded-md transition-all cursor-pointer"
                            [class]="activeSessionId() === session.id ? 'bg-surface shadow-sm text-text-main font-semibold' : 'text-text-muted hover:text-text-main'">
                            {{ session.name }}
                        </button>
                        }
                    </div>
                </div>
            </div>
        </div>

        <!-- BODY -->
        <div class="px-3 py-3 flex-1 overflow-y-auto overflow-x-hidden flex flex-col gap-3">

            <!-- CONNECTION -->
            <app-sidebar-connection [sessionId]="activeSessionId()"></app-sidebar-connection>

            <!-- PARAMETERS -->
            <div class="sidebar-section">
                <app-sidebar-parameters [sessionId]="activeSessionId()"></app-sidebar-parameters>
            </div>

            <!-- OPTIONS -->
            <div class="sidebar-section">
                <app-sidebar-options></app-sidebar-options>
            </div>

            <!-- CREDITS -->
            <div class="sidebar-section text-[11px] text-text-muted leading-relaxed mt-auto">
                <p>Token y chat quedan en este navegador.</p>
                <p class="mt-1">Un proyecto de <a href="https://miwebideal.com.ar" target="_blank"
                        rel="noopener noreferrer" class="text-primary hover:underline font-medium">MiWebIdeal</a></p>
                <a href="https://github.com/miwebideal/llm-playground" target="_blank" rel="noopener noreferrer"
                    class="mt-2 inline-flex items-center gap-1 hover:text-text-main font-medium">
                    Repo
                    <svg lucideExternalLink class="w-3 h-3 text-primary"></svg>
                </a>
            </div>
        </div>
    </div>
    }
</aside>
