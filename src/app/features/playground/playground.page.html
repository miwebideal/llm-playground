<!-- src/app/features/playground/playground.page.html -->

@if (sessionStore.isLoaded() && providerStore.isLoaded()) {

<div class="flex-1 min-w-0 flex flex-col gap-3 p-3 md:p-4 min-h-0">

    <!-- TOP BAR -->
    <div class="flex items-center gap-2 shrink-0">
        <div class="segmented" role="group" aria-label="Modo de chat">
            <button type="button" [class.on]="!split()" [attr.aria-pressed]="!split()" (click)="setSplit(false)">
                <svg lucideSquare class="w-3.5 h-3.5"></svg> Único
            </button>
            <button type="button" [class.on]="split()" [attr.aria-pressed]="split()" (click)="setSplit(true)">
                <svg lucideColumns2 class="w-3.5 h-3.5"></svg> Dividir
            </button>
        </div>

        <div class="ml-auto flex items-center gap-2">
            <div class="relative">
                <button type="button" class="btn" (click)="exportOpen.set(!exportOpen())" [attr.aria-expanded]="exportOpen()" aria-haspopup="menu">
                    <svg lucideDownload class="w-3.5 h-3.5"></svg><span class="hidden sm:inline">Exportar</span>
                </button>
                @if (exportOpen()) {
                <div class="fixed inset-0 z-40" (click)="exportOpen.set(false)"></div>
                <div role="menu" class="absolute right-0 mt-1.5 z-50 w-56 card shadow-xl p-1.5 animate-scale-in">
                    <button role="menuitem" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-sm hover:bg-surface-alt cursor-pointer" (click)="export('md')">
                        <svg lucideFileText class="w-4 h-4 text-text-muted"></svg> Markdown (.md)</button>
                    <button role="menuitem" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-sm hover:bg-surface-alt cursor-pointer" (click)="export('json')">
                        <svg lucideFileBraces class="w-4 h-4 text-text-muted"></svg> JSON</button>
                    <button role="menuitem" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg text-sm hover:bg-surface-alt cursor-pointer" (click)="export('copy')">
                        <svg lucideCopy class="w-4 h-4 text-text-muted"></svg> Copiar al portapapeles</button>
                    <label class="flex items-center gap-2 px-2.5 py-2 mt-1 border-t border-border-base text-xs text-text-muted cursor-pointer">
                        <input type="checkbox" [checked]="includeReasoning()" (change)="toggleReasoning()" class="accent-(--primary)"> Incluir razonamiento
                    </label>
                </div>
                }
            </div>

            <button type="button" class="btn" [class.btn-primary]="drawerOpen()" (click)="ui.toggle('drawerOpen')" [attr.aria-expanded]="drawerOpen()">
                <svg lucideSlidersHorizontal class="w-3.5 h-3.5"></svg> Ajustes
            </button>
        </div>
    </div>

    <app-chat-layout class="flex-1"></app-chat-layout>

    <app-chat-input class="shrink-0"></app-chat-input>
</div>

<!-- SETTINGS PANEL -->
@if (drawerOpen()) {
<div class="xl:hidden fixed inset-0 z-40 bg-black/30 animate-fade-in" (click)="ui.set('drawerOpen', false)"></div>
<app-settings-drawer class="fixed xl:static inset-y-0 right-0 z-50 w-[min(340px,100vw)] xl:w-[320px] shrink-0 animate-fade-in"></app-settings-drawer>
}

} @else {
<div class="flex-1 flex items-center justify-center">
    <div class="w-6 h-6 border-2 border-primary border-t-transparent rounded-full animate-spin" aria-label="Cargando"></div>
</div>
}
